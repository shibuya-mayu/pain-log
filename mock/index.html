<style>
/* Layout: one phone-width app column (max 520px), sticky header, bottom tab bar, full-screen form sheet over it */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #e6eaef;
  --fg: #16202b;
  --muted: #5a6573;
  --line: #d3dae2;
  --accent: #3448c5;
  --accent-ink: #ffffff;
  --accent-soft: #e2e6fb;
  --sun: #c23b3b;
  --sat: #2f62b8;
  /* pain ramp 0..10 (one warm hue, light → dark) */
  --p0: #dfe5ea; --p0-ink: #3d4752;
  --p1: #fde5d6; --p1-ink: #5a2a12;
  --p2: #f9bf9c; --p2-ink: #5a2a12;
  --p3: #f08a57; --p3-ink: #3c1606;
  --p4: #d65520; --p4-ink: #ffffff;
  --p5: #9f330c; --p5-ink: #ffffff;
  /* chart series: during / after / next day */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  /* intensity (ordinal, one hue): 抑えめ → 全力 */
  --i1: #86b6ef; --i2: #5598e7; --i3: #2a78d6; --i4: #1c5cab; --i5: #104281;
  --grid: #e3e8ed;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --surface: #181e25; --surface-2: #222a33; --fg: #e8ecf0; --muted: #9ba6b2;
    --line: #2d3741; --accent: #8e9cf2; --accent-ink: #0d1230; --accent-soft: #262d54;
    --sun: #ee7d7d; --sat: #7fa7ec;
    --p0: #2a333c; --p0-ink: #c4ccd4;
    --p1: #4a3020; --p1-ink: #fbd9c4;
    --p2: #7a3e1d; --p2-ink: #fde3d3;
    --p3: #b4521f; --p3-ink: #ffffff;
    --p4: #e06a30; --p4-ink: #1a0a02;
    --p5: #f59a6a; --p5-ink: #1a0a02;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --i1: #1c5cab; --i2: #256abf; --i3: #3987e5; --i4: #6da7ec; --i5: #b7d3f6;
    --grid: #26303a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #181e25; --surface-2: #222a33; --fg: #e8ecf0; --muted: #9ba6b2;
  --line: #2d3741; --accent: #8e9cf2; --accent-ink: #0d1230; --accent-soft: #262d54;
  --sun: #ee7d7d; --sat: #7fa7ec;
  --p0: #2a333c; --p0-ink: #c4ccd4;
  --p1: #4a3020; --p1-ink: #fbd9c4;
  --p2: #7a3e1d; --p2-ink: #fde3d3;
  --p3: #b4521f; --p3-ink: #ffffff;
  --p4: #e06a30; --p4-ink: #1a0a02;
  --p5: #f59a6a; --p5-ink: #1a0a02;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --i1: #1c5cab; --i2: #256abf; --i3: #3987e5; --i4: #6da7ec; --i5: #b7d3f6;
  --grid: #26303a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 14px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.mockbar { background: var(--accent-soft); color: var(--fg); font-size: 12px; text-align: center; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.mockbar a { color: var(--accent); }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; background: var(--bg); padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px; }
.top h1 { font-family: var(--font-display); font-size: 19px; font-weight: 900; margin: 0; flex: 1; letter-spacing: .02em; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-width: 36px; height: 36px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; }
.iconbtn:hover { background: var(--surface-2); }
.section { padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* calendar */
.cal { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-head div { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 0; letter-spacing: .08em; }
.cal-head div:nth-child(6) { color: var(--sat); } .cal-head div:nth-child(7) { color: var(--sun); }
.day { position: relative; min-height: 74px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: 4px 3px 4px; background: var(--surface); text-align: left; display: flex; flex-direction: column; gap: 2px; border-right: 0; border-bottom: 0; }
.day:nth-child(7n+1) { border-left: 0; }
.day.out { background: var(--surface-2); opacity: .55; }
.day .dn { font-size: 12px; font-weight: 500; line-height: 1; padding: 2px 2px 0; }
.day.sun .dn { color: var(--sun); } .day.sat .dn { color: var(--sat); }
.day.today .dn { background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 3px 6px; align-self: flex-start; }
.day.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.badge { position: absolute; top: 3px; right: 3px; min-width: 20px; height: 20px; border-radius: 6px; font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
.chip-ex { font-size: 10px; line-height: 1; padding: 3px 3px; border-radius: 4px; background: var(--accent-soft); color: var(--fg); white-space: nowrap; }
.chip-pain { font-size: 10px; line-height: 1; padding: 3px 3px; border-radius: 4px; border: 1px dashed var(--line); color: var(--muted); }
.lv0 { background: var(--p0); color: var(--p0-ink); } .lv1 { background: var(--p1); color: var(--p1-ink); }
.lv2 { background: var(--p2); color: var(--p2-ink); } .lv3 { background: var(--p3); color: var(--p3-ink); }
.lv4 { background: var(--p4); color: var(--p4-ink); } .lv5 { background: var(--p5); color: var(--p5-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; color: var(--muted); margin-top: 10px; align-items: center; }
.legend .sw { display: inline-flex; gap: 2px; vertical-align: middle; }
.legend .sw span { width: 16px; height: 12px; border-radius: 3px; font-size: 9px; display: grid; place-items: center; }

/* day panel */
.daypanel { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.daypanel h2 { font-family: var(--font-display); font-size: 16px; margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--sun); }
.btn.block { width: 100%; }
.rec { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; background: var(--bg); }
.rec-h { display: flex; align-items: center; gap: 8px; }
.rec-h strong { flex: 1; min-width: 0; }
.kind { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--accent-soft); white-space: nowrap; }
.kind.p { background: var(--surface-2); }
.rec dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.rec dt { color: var(--muted); } .rec dd { margin: 0; min-width: 0; }
.lvpill { display: inline-block; min-width: 18px; text-align: center; border-radius: 4px; font-size: 11px; font-weight: 700; padding: 0 4px; margin-right: 2px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* bottom nav + fab */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { background: none; border: 0; padding: 10px 0 12px; font-size: 12px; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }
.fab { position: fixed; z-index: 26; right: max(16px, calc((100vw - 520px) / 2 + 16px)); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 30px; line-height: 1; box-shadow: 0 6px 18px rgba(20,30,80,.28); }
.fabmenu { position: fixed; z-index: 26; right: max(16px, calc((100vw - 520px) / 2 + 16px)); bottom: calc(136px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: end; }
.fabmenu .btn { box-shadow: 0 4px 14px rgba(20,30,80,.18); }

/* form sheet */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-in { max-width: 520px; margin: 0 auto; }
.sheet .top { top: 0; }
.form { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.card h3 { margin: 0; font-family: var(--font-display); font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card h3 .step { font-size: 11px; font-family: var(--font-body); font-weight: 500; color: var(--muted); letter-spacing: .06em; }
.field { display: grid; gap: 4px; }
.field label, .lbl { font-size: 12px; color: var(--muted); }
.inp { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--surface); min-width: 0; }
textarea.inp { min-height: 72px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; }
.toggle[aria-pressed="true"] { background: var(--p0); border-color: var(--p0); font-weight: 700; }
.painrow { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; background: var(--bg); }
.painrow-h { display: flex; gap: 8px; align-items: center; }
.painrow-h select { flex: 1; }
.x { border: 0; background: none; color: var(--muted); font-size: 18px; width: 32px; height: 32px; border-radius: 6px; }
.x:hover { background: var(--surface-2); }
.scale { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
.scale button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; height: 34px; font-size: 13px; font-weight: 500; padding: 0; font-variant-numeric: tabular-nums; }
.scale button[aria-pressed="true"] { border-color: transparent; font-weight: 700; transform: scale(1.06); }
.scale-cap { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.add { border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 9px; color: var(--accent); font-weight: 500; width: 100%; }
.add:hover { background: var(--accent-soft); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 10px; font-size: 12px; }
.quick button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.act { border-left: 3px solid var(--accent); }
.hint { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.hint b { color: var(--fg); }
.connector { text-align: center; font-size: 11px; color: var(--muted); margin: -6px 0; }
.savebar { position: sticky; bottom: 0; background: var(--bg); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; border-top: 1px solid var(--line); }
.savebar .primary { flex: 1; }

/* graphs */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select { width: auto; flex: 1; min-width: 120px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.tile .v { font-family: var(--font-display); font-size: 26px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.tile .k { font-size: 11px; color: var(--muted); }
.chartcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.chartcard h2 { margin: 0; font-family: var(--font-display); font-size: 15px; }
.insight { font-size: 13px; }
.insight b { font-weight: 700; }
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.keys i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
svg.chart .lab { fill: var(--fg); font-size: 12px; }
details.tbl summary { font-size: 12px; color: var(--accent); cursor: pointer; }
.tblwrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 6px; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; }
.intens { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.intens button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 2px; display: grid; gap: 1px; justify-items: center; line-height: 1.2; }
.intens button b { font-size: 16px; font-variant-numeric: tabular-nums; }
.intens button span { font-size: 10px; color: var(--muted); }
.intens button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.intens button[aria-pressed="true"] span { color: var(--accent-ink); }
.hist { font-size: 12px; background: var(--surface-2); border-radius: 6px; padding: 6px 9px; color: var(--muted); }
.hist b { color: var(--fg); font-variant-numeric: tabular-nums; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; line-height: 1.5; max-width: 220px; }

/* settings */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.list > div { padding: 11px 14px; display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); align-items: center; }
.list > div:first-child { border-top: 0; }
.list h3 { margin: 0; font-size: 13px; }
.grp { font-size: 12px; color: var(--muted); margin: 14px 2px 6px; letter-spacing: .06em; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .scale button { transition: transform .12s; }
  .toast { animation: up .2s ease-out; }
  @keyframes up { from { transform: translate(-50%, 8px); opacity: 0; } }
}
@media (min-width: 560px) { .day { min-height: 84px; } .chip-ex, .chip-pain { font-size: 11px; } }
</style>

const intName = id => { const t = INTENS.find(t => t.id === id) || INTENS[2]; return `強度${t.id} ${t.name}`; };
/* graph grouping: 3 groups (default) or all 5 levels */
function intGroups() {
  return settings.intView === '5'
    ? INTENS.map(t => ({ id: String(t.id), name: `${t.id} ${t.name}`, color: `var(--i${t.id})` }))
    : [{ id: 'L', name: '抑えめ（1〜2）', color: 'var(--i1)' }, { id: 'M', name: 'ふつう（3）', color: 'var(--i3)' }, { id: 'H', name: '全力寄り（4〜5）', color: 'var(--i5)' }];
}
const groupOf = lv => settings.intView === '5' ? String(lv) : lv <= 2 ? 'L' : lv === 3 ? 'M' : 'H';
const TODAY = '2026-11-10';
const typeOf = id => TYPES.find(t => t.id === id) || TYPES[TYPES.length - 1];
const partOf = id => PARTS.find(p => p.id === id) || PARTS[PARTS.length - 1];
const actName = a => !a.typeId ? '種類を選んでください' : a.typeId === 'ot' ? (a.otherName || 'その他') : typeOf(a.typeId).name;
const actShort = a => a.typeId === 'ot' ? (a.otherName || '他').slice(0, 3) : typeOf(a.typeId).short;
const lvClass = v => v == null ? '' : v === 0 ? 'lv0' : v <= 2 ? 'lv1' : v <= 4 ? 'lv2' : v <= 6 ? 'lv3' : v <= 8 ? 'lv4' : 'lv5';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };

const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = v => Math.max(0, Math.min(10, Math.round(v)));
const emptySet = () => ({ none: false, items: [] });

/* level of a pain set: null = 未記入, 0 = 痛みなし, else max (optionally for one part) */
function setLevel(set, part) {
  if (!set) return null;
  if (set.none) return 0;
  const items = part ? set.items.filter(i => i.partId === part) : set.items;
  if (!set.items.length) return null;
  if (!items.length) return part ? 0 : null;
  return Math.max(...items.map(i => i.level));
}

/* ---------- sample data ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function sample() {
  const r = rng(11), recs = [];
  const prof = { ba: [4, 5, 4], bc: [3, 4, 3], bp: [2, 3, 2], bs: [3, 4, 3], yg: [1, 1, 1], pl: [0, 1, 1], rn: [4, 5, 4], tt: [2, 3, 2], bd: [4, 4, 3], mt: [3, 5, 5] };
  const pick = ['ba', 'ba', 'bc', 'bc', 'bp', 'bp', 'bs', 'yg', 'yg', 'pl', 'rn', 'tt', 'mt'];
  const j = () => Math.round((r() - 0.5) * 2.4);
  const part = () => { const x = r(); return x < 0.62 ? 'groin' : x < 0.8 ? 'hipside' : x < 0.92 ? 'buttock' : 'thighF'; };
  const mk = lv => lv <= 0 ? { none: true, items: [] } : { none: false, items: [{ partId: part(), side: 'R', level: clamp(lv) }].concat(lv >= 5 && r() < 0.35 ? [{ partId: 'buttock', side: 'R', level: clamp(lv - 2) }] : []) };
  let carry = null;
  for (let ds = '2026-09-01'; ds <= TODAY; ds = addDays(ds, 1)) {
    const dow = parse(ds).getDay();
    const base = carry ?? Math.round(r() * 2);
    if (carry != null || r() < 0.45) recs.push({ id: uid(), kind: 'pain', date: ds, timing: 'wake', pain: mk(base), memo: '' });
    carry = null;
    if (ds === TODAY) break;
    if (r() < (dow === 0 || dow === 6 ? 0.75 : 0.5)) {
      const t1 = pick[Math.floor(r() * pick.length)];
      const ts = [t1];
      if ((t1 === 'ba' || t1 === 'bc' || t1 === 'bs') && r() < 0.35) ts.push(r() < 0.5 ? 'bp' : 'yg');
      const MOD = { 1: -2, 2: -1, 3: 0, 4: 0.7, 5: 1.3 };
      const MV = { ba: ['ジャンプ', 'ランジ'], bc: ['キック', 'ひねり'], bp: ['スクワット', 'ランジ'], bs: ['ステップ昇降', 'ランジ'], tt: ['切り返し'], bd: ['切り返し', 'ジャンプ'], rn: ['着地'], mt: ['下り坂', 'ステップ昇降'], yg: ['開脚', '片脚立ち'], pl: ['キック'] };
      const acts = ts.map(t => {
        const x = r(), it = x < 0.12 ? 1 : x < 0.3 ? 2 : x < 0.6 ? 3 : x < 0.85 ? 4 : 5;
        const dl = prof[t][0] + MOD[it] + j();
        let mv = dl >= 3 ? MV[t].filter(() => r() < 0.6) : [];
        if (dl >= 3 && !mv.length) mv = [MV[t][0]];
        return { typeId: t, otherName: '', minutes: typeOf(t).min, intensity: it, moves: mv, during: mk(dl), _m: MOD[it] };
      });
      const after = Math.max(...acts.map(a => prof[a.typeId][1] + a._m)) + j();
      const nextLv = Math.max(...acts.map(a => prof[a.typeId][2] + a._m)) + j();
      acts.forEach(a => delete a._m);
      recs.push({ id: uid(), kind: 'exercise', date: ds, startTime: dow === 0 || dow === 6 ? '10:30' : '19:15', before: mk(base + (r() < 0.3 ? 1 : 0)), activities: acts, after: mk(after), memo: ts.includes('ba') && r() < 0.4 ? 'ジャンプ系の後半で鼠径部に引っかかり' : '' });
      carry = nextLv;
    }
  }
  return recs;
}

const settings = { calMode: 'max', useTags: false, tags: ['ズキズキ', '鈍い', '引っかかる', '抜ける感じ', '張り'], gapMin: 30, intView: '3', moves: ['ジャンプ', 'キック', 'ランジ', 'スクワット', '開脚', 'ひねり', '片脚立ち', 'ステップ昇降', '切り返し', '着地', '下り坂'] };

function recordsOn(ds) { return state.records.filter(r => r.date === ds).sort((a, b) => (a.kind === 'pain' && a.timing === 'wake' ? -1 : 0) - (b.kind === 'pain' && b.timing === 'wake' ? -1 : 0) || String(a.startTime || '').localeCompare(String(b.startTime || ''))); }
function setsOf(r) { return r.kind === 'pain' ? [r.pain] : [r.before, ...r.activities.map(a => a.during), r.after]; }
function dayMax(ds, part) {
  const ls = recordsOn(ds).flatMap(setsOf).map(s => setLevel(s, part)).filter(v => v != null);
  return ls.length ? Math.max(...ls) : null;
}
function dayAvg(ds) {
  const ls = recordsOn(ds).flatMap(setsOf).map(s => setLevel(s)).filter(v => v != null);
  return ls.length ? ls.reduce((a, b) => a + b, 0) / ls.length : null;
}

    <div class="section" style="display:grid;gap:12px">
      <div class="filters">
        <select class="inp" id="g-period" aria-label="期間">${[['30', '直近30日'], ['90', '直近90日'], ['all', '全期間']].map(([v, l]) => `<option value="${v}" ${state.period === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select class="inp" id="g-part" aria-label="部位"><option value="">全部位</option>${PARTS.map(p => `<option value="${p.id}" ${state.part === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}</select>
      </div>
      <div class="tiles">
        <div class="tile"><div class="k">運動回数</div><div class="v">${s.exCount}<small>回</small></div></div>
        <div class="tile"><div class="k">痛みの平均</div><div class="v">${f1(s.avgPain)}<small>/10</small></div></div>
        <div class="tile"><div class="k">痛み7以上</div><div class="v">${s.highDays}<small>日</small></div></div>
      </div>
      <div class="chartcard">
        <h2>運動の種類別 痛みの平均</h2>
        ${top ? `<p class="insight" style="margin:0">運動後の痛みが最も高いのは<b>${esc(top.name)}</b>（平均 ${f1(top.a)}）、低いのは<b>${esc(low.name)}</b>（平均 ${f1(low.a)}）。</p>` : ''}
        <div class="keys"><span><i style="background:var(--s1)"></i>運動中</span><span><i style="background:var(--s2)"></i>運動後</span><span><i style="background:var(--s3)"></i>翌日</span></div>
        ${s.types.length ? typeChart(s.types) : '<p class="muted">この期間の運動記録がありません。</p>'}
        <details class="tbl"><summary>表で見る</summary><div class="tblwrap"><table><tr><th>運動</th><th>回数</th><th>運動中</th><th>運動後</th><th>翌日</th></tr>${s.types.map(t => `<tr><td>${esc(t.name)}</td><td>${t.n}</td><td>${f1(t.d)}</td><td>${f1(t.a)}</td><td>${f1(t.x)}</td></tr>`).join('')}</table></div></details>
      </div>
      <div class="chartcard">
        <h2>強度別 運動後の痛み</h2>
        <p class="small muted" style="margin:0">同じ運動でも、強度で痛みがどう変わるか。タップで翌日の値も表示します。薄い棒は 3 回未満の参考値です。</p>
        <div class="row" style="justify-content:space-between"><div class="keys">${intGroups().map(k => `<span><i style="background:${k.color}"></i>${k.name}</span>`).join('')}</div>
        <span class="seg">${[['3', '3つにまとめる'], ['5', '5段階']].map(([v, l]) => `<button type="button" data-iv="${v}" aria-pressed="${settings.intView === v}">${l}</button>`).join('')}</span></div>
        ${intensityChart(s.types)}
      </div>
      <div class="chartcard">
        <h2>痛んだ動き</h2>
        <p class="small muted" style="margin:0">記録された回数と、そのときの運動中の痛みの平均</p>
        ${s.moves.length ? partChart(s.moves, '回', '運動中') : '<p class="muted">この期間に「痛んだ動き」の記録がありません。</p>'}
      </div>
      <div class="chartcard">
        <h2>痛みの推移（日ごとの最大値）</h2>
        <div class="keys"><span>● 運動した日　タップで内容を表示</span></div>
        ${trendChart(s.dayList)}
      </div>
      <div class="chartcard">
        <h2>週ごとの運動量と痛み</h2>
        ${weeklyChart(s.weeks)}
      </div>
      <div class="chartcard">
        <h2>連日運動の影響（翌日の痛み）</h2>
        <div class="tiles" style="grid-template-columns:1fr 1fr">
          <div class="tile"><div class="k">前日も運動した日の翌日</div><div class="v">${f1(s.cons.avg)}<small>/10</small></div><div class="k num">${s.cons.n}回</div></div>
          <div class="tile"><div class="k">間を空けた日の翌日</div><div class="v">${f1(s.gap.avg)}<small>/10</small></div><div class="k num">${s.gap.n}回</div></div>
        </div>
        ${s.cons.avg != null && s.gap.avg != null ? `<p class="insight" style="margin:0">連日運動したときの翌日の痛みは、間を空けたときより <b>${f1(Math.abs(s.cons.avg - s.gap.avg))}</b> ${s.cons.avg >= s.gap.avg ? '高い' : '低い'}です。</p>` : ''}
      </div>
      <div class="chartcard">
        <h2>部位別 痛みが出た日数</h2>
        ${s.parts.length ? partChart(s.parts) : '<p class="muted">この期間に痛みの記録がありません。</p>'}
      </div>
      <p class="small muted" style="margin:0">集計ルール: 1つのタイミングに複数の痛みがあるときは最大値。「痛みなし」は 0、未記入は集計しません。翌日＝翌日の起床時の記録（なければその日の最大値）。</p>
    </div>`;
  $('#g-period').onchange = e => { state.period = e.target.value; render(); };
  $('#g-part').onchange = e => { state.part = e.target.value; render(); };
  app.querySelectorAll('[data-iv]').forEach(b => b.onclick = () => { settings.intView = b.dataset.iv; render(); });
  bindTips();
}
function bindTips() {
  app.querySelectorAll('[data-tip]').forEach(el => {
    const show = e => {
      tip.innerHTML = el.dataset.tip; tip.hidden = false;
      const p = e.touches ? e.touches[0] : e;
      const x = Math.min(p.clientX + 12, innerWidth - tip.offsetWidth - 8);
      tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, p.clientY - tip.offsetHeight - 12) + 'px';
      const xh = el.ownerSVGElement.querySelector('#xh');
      if (xh && el.dataset.x) { xh.setAttribute('x1', el.dataset.x); xh.setAttribute('x2', el.dataset.x); xh.setAttribute('visibility', 'visible'); }
    };
    el.addEventListener('pointermove', show); el.addEventListener('pointerdown', show);
    el.addEventListener('pointerleave', () => { tip.hidden = true; const xh = el.ownerSVGElement.querySelector('#xh'); if (xh) xh.setAttribute('visibility', 'hidden'); });
  });
}

/* ---------- settings ---------- */
function renderSettings() {
  if (state.sub) return renderMaster(state.sub);
  const seg = (key, opts) => `<span class="seg">${opts.map(([v, l]) => `<button type="button" data-set-k="${key}" data-set-v="${v}" aria-pressed="${String(settings[key]) === v}">${l}</button>`).join('')}</span>`;
  app.innerHTML = `
    <header class="top"><h1>設定</h1></header>
    <div class="section">
      <div class="grp">入力の候補（追加・非表示ができます）</div>
      <div class="list">
        <div><h3>運動の種類</h3><button class="btn small" data-sub="types">${TYPES.filter(t => !t.hidden).length}件 ›</button></div>
        <div><h3>痛みの部位</h3><button class="btn small" data-sub="parts">${PARTS.filter(t => !t.hidden).length}件 ›</button></div>
        <div><h3>痛みの種類タグを使う</h3>${seg('useTags', [['false', 'オフ'], ['true', 'オン']])}</div>
        ${settings.useTags ? `<div><h3>痛みの種類タグ</h3><button class="btn small" data-sub="tags">${settings.tags.length}件 ›</button></div>` : ''}
        <div><h3>痛んだ動き</h3><button class="btn small" data-sub="moves">${settings.moves.length}件 ›</button></div>
        <div><h3>「続けて追加」の目安</h3>${seg('gapMin', [['30', '30分'], ['60', '60分']])}</div>
      </div>
      <div class="grp">表示</div>
      <div class="list">
        <div><h3>強度グラフの表示</h3>${seg('intView', [['3', '3つにまとめる'], ['5', '5段階']])}</div>
        <div><h3>カレンダーの数字</h3>${seg('calMode', [['max', '最大値'], ['avg', '平均']])}</div>
        <div><h3>週の始まり</h3><span class="small muted">月曜</span></div>
      </div>
      <div class="grp">データ</div>
      <div class="list">
        <div><h3>バックアップを書き出す</h3><button class="btn small" data-mock>書き出す</button></div>
        <div><h3>バックアップから読み込む</h3><button class="btn small" data-mock>読み込む</button></div>
        <div><span class="small muted">最終バックアップ: 2026年10月28日</span></div>
      </div>
      <p class="small muted">データはこのスマホの中に保存されます。機種変更のときは「書き出す」で iCloud Drive などにファイルを保存し、新しいスマホで「読み込む」と引き継げます。</p>
    </div>`;
  app.querySelectorAll('[data-mock]').forEach(b => b.onclick = () => toast('モックのため動作しません'));
  app.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { state.sub = b.dataset.sub; render(); });
  app.querySelectorAll('[data-set-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.setK, v = b.dataset.setV;
    settings[k] = v === 'true' ? true : v === 'false' ? false : /^\d+$/.test(v) ? +v : v;
    toast('変更しました'); render();
  });
}
function renderMaster(kind) {
  const title = { types: '運動の種類', parts: '痛みの部位', tags: '痛みの種類タグ', moves: '痛んだ動き' }[kind];
  const strList = kind === 'tags' || kind === 'moves';
  const items = strList ? settings[kind].map(t => ({ id: t, name: t })) : (kind === 'types' ? TYPES : PARTS);
  app.innerHTML = `
    <header class="top"><button class="iconbtn" id="m-back" aria-label="戻る">‹</button><h1>${title}</h1></header>
    <div class="section" style="display:grid;gap:12px">
      <div class="list">${items.map((t, i) => `<div><h3 style="${t.hidden ? 'opacity:.45;text-decoration:line-through' : ''}">${esc(t.name)}${kind === 'types' ? `<span class="small muted">　${esc(t.short)}</span>` : ''}</h3>
        ${strList ? `<button class="btn small danger" data-del="${i}">削除</button>` : `<button class="btn small" data-hide="${i}">${t.hidden ? '表示する' : '非表示'}</button>`}</div>`).join('')}</div>
      <form class="row" id="m-add"><input class="inp" id="m-name" style="flex:1" placeholder="追加する名前（例: ${kind === 'types' ? 'ピラティス' : kind === 'parts' ? 'ふくらはぎ' : kind === 'moves' ? 'ターン' : 'しびれ'}）" required><button class="btn primary">追加</button></form>
      <p class="small muted" style="margin:0">非表示にしても、過去の記録とグラフには残ります。${kind === 'types' ? 'カレンダーには名前の先頭2文字を表示します。' : ''}</p>
    </div>`;
  $('#m-back').onclick = () => { state.sub = null; render(); };
  app.querySelectorAll('[data-hide]').forEach(b => b.onclick = () => { items[+b.dataset.hide].hidden = !items[+b.dataset.hide].hidden; render(); });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { settings[kind].splice(+b.dataset.del, 1); render(); });
  $('#m-add').onsubmit = e => {
    e.preventDefault(); const name = $('#m-name').value.trim(); if (!name) return;
    if (strList) settings[kind].push(name);
    else if (kind === 'types') TYPES.splice(TYPES.length - 1, 0, { id: 'u' + uid(), name, short: name.slice(0, 2), min: 30 });
    else PARTS.splice(PARTS.length - 1, 0, { id: 'u' + uid(), name });
    toast(`「${name}」を追加しました`); render();
  };
}

/* ---------- shell ---------- */
function render() {
  document.querySelectorAll('.tab').forEach(t => { if (t.dataset.tab === state.tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  $('#fab').hidden = state.tab === 'settings';
  tip.hidden = true;
  if (state.tab === 'calendar') renderCalendar(); else if (state.tab === 'graph') renderGraph(); else renderSettings();
}
let toastT;
function toast(msg) { document.querySelector('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }

document.querySelectorAll('.tab').forEach(t => t.onclick = () => { state.tab = t.dataset.tab; state.sub = null; scrollTo(0, 0); render(); });
const fab = $('#fab'), fm = $('#fabmenu');
fab.onclick = () => { fm.hidden = !fm.hidden; fab.setAttribute('aria-expanded', String(!fm.hidden)); fab.textContent = fm.hidden ? '＋' : '×'; };
const closeFab = () => { fm.hidden = true; fab.textContent = '＋'; fab.setAttribute('aria-expanded', 'false'); };
$('#fab-ex').onclick = () => { closeFab(); openForm(newRecord('exercise', TODAY)); };
$('#fab-pain').onclick = () => { closeFab(); openForm(newRecord('pain', TODAY)); };
addEventListener('resize', () => { tip.hidden = true; });
render();
})();
</script>
